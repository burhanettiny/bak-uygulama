import React, {useState, useEffect, useRef} from 'react';
import {
  View, Text, TouchableOpacity, StyleSheet, ScrollView,
  KeyboardAvoidingView, Platform, Alert, Vibration,
} from 'react-native';
import Tts from 'react-native-tts';
import Voice from '@react-native-voice/voice';
import {
  Camera, useCameraDevice, useCodeScanner,
} from 'react-native-vision-camera';
import TextRecognition from '@react-native-ml-kit/text-recognition';

// ── Tipler ────────────────────────────────────────────────
interface KonumBilgisi {
  bolum: string;
  koridor: string;
  raf: string;
  yonTarifi: string;
}

interface UrunBilgisi {
  ad: string;
  marka: string;
  kategori?: string;
  konum?: KonumBilgisi;
  kaynak?: string;
  skt?: string; // Son Kullanma Tarihi
}

type Mod = 'ana' | 'barkod' | 'pos' | 'skt';

// ── Titreşim kalıpları ────────────────────────────────────
const TITRESIM = {
  barkodOkundu:   [0, 100],
  urunBulundu:    [0, 100, 80, 200],
  urunBulunamadi: [0, 200, 100, 200],
  posBulundu:     [0, 100, 80, 100, 80, 300],
  hata:           [0, 400, 150, 400],
  sesKomut:       [0, 60],
};

// ── QR Konum veritabanı ───────────────────────────────────
const QR_KONUMLAR: Record<string, KonumBilgisi> = {
  'GIRIS':          {bolum:'Giriş',        koridor:'',  raf:'', yonTarifi:'Market girişindesiniz. Sepetler solunuzda.'},
  'REYON-MEYVE':    {bolum:'Meyve Sebze',  koridor:'1', raf:'', yonTarifi:'Meyve sebze reyonundasınız, 1. koridor.'},
  'REYON-SUT':      {bolum:'Süt Ürünleri', koridor:'3', raf:'', yonTarifi:'Süt ürünleri reyonundasınız, 3. koridor.'},
  'REYON-ET':       {bolum:'Et Ürünleri',  koridor:'4', raf:'', yonTarifi:'Et ürünleri reyonundasınız, 4. koridor.'},
  'REYON-EKMEK':    {bolum:'Ekmek Fırın',  koridor:'2', raf:'', yonTarifi:'Ekmek ve fırın ürünleri, 2. koridor.'},
  'REYON-TEMIZLIK': {bolum:'Temizlik',     koridor:'6', raf:'', yonTarifi:'Temizlik ürünleri reyonundasınız, 6. koridor.'},
  'REYON-ICECEK':   {bolum:'İçecek',       koridor:'5', raf:'', yonTarifi:'İçecek reyonundasınız, 5. koridor.'},
  'KASA':           {bolum:'Kasa',         koridor:'',  raf:'', yonTarifi:'Kasalara ulaştınız. Ödeme yapabilirsiniz.'},
};

// ── Kategori → Konum tahmini ──────────────────────────────
function kategorideKonum(kategori: string, urunAd: string): KonumBilgisi {
  const k = (kategori + ' ' + urunAd).toLowerCase();
  if (k.match(/süt|peynir|yoğurt|tereyağ|krema|milk|cheese|dairy|yogurt/))
    return {bolum:'Süt Ürünleri', koridor:'3', raf:'2', yonTarifi:'Bu ürün genellikle 3. koridorda, süt ürünleri reyonunda bulunur.'};
  if (k.match(/ekmek|unlu|pasta|bisküvi|çikolata|bread|biscuit|chocolate|cake|cookie/))
    return {bolum:'Fırın & Unlu', koridor:'2', raf:'1', yonTarifi:'Bu ürün genellikle 2. koridorda, unlu mamuller reyonunda bulunur.'};
  if (k.match(/et|tavuk|balık|sucuk|salam|meat|chicken|fish|beef|poultry/))
    return {bolum:'Et Ürünleri', koridor:'4', raf:'1', yonTarifi:'Bu ürün genellikle 4. koridorda, et ürünleri reyonunda bulunur.'};
  if (k.match(/meyve|sebze|salata|domates|elma|fruit|vegetable|tomato|apple/))
    return {bolum:'Meyve Sebze', koridor:'1', raf:'', yonTarifi:'Bu ürün genellikle 1. koridorda, meyve sebze reyonunda bulunur.'};
  if (k.match(/su|kola|meyve suyu|çay|kahve|içecek|water|juice|coffee|tea|beverage|drink|soda/))
    return {bolum:'İçecek', koridor:'5', raf:'3', yonTarifi:'Bu ürün genellikle 5. koridorda, içecek reyonunda bulunur.'};
  if (k.match(/deterjan|sabun|şampuan|temizlik|detergent|shampoo|soap|cleaning|beauty|kozmetik|cream|lotion|perfume/))
    return {bolum:'Temizlik & Kozmetik', koridor:'6', raf:'2', yonTarifi:'Bu ürün genellikle 6. koridorda, temizlik ve kozmetik reyonunda bulunur.'};
  if (k.match(/elektronik|telefon|kablo|pil|electronic|battery|cable|phone|headphone|charger/))
    return {bolum:'Elektronik', koridor:'7', raf:'1', yonTarifi:'Bu ürün genellikle 7. koridorda, elektronik reyonunda bulunur.'};
  if (k.match(/kitap|dergi|kırtasiye|book|magazine|stationery|pen|notebook/))
    return {bolum:'Kırtasiye & Kitap', koridor:'8', raf:'1', yonTarifi:'Bu ürün genellikle 8. koridorda, kırtasiye reyonunda bulunur.'};
  if (k.match(/oyuncak|toy|game|puzzle/))
    return {bolum:'Oyuncak', koridor:'9', raf:'1', yonTarifi:'Bu ürün genellikle 9. koridorda, oyuncak reyonunda bulunur.'};
  if (k.match(/giysi|kıyafet|ayakkabı|clothing|shirt|pants|shoes|apparel/))
    return {bolum:'Giyim', koridor:'10', raf:'', yonTarifi:'Bu ürün genellikle 10. koridorda, giyim reyonunda bulunur.'};
  return {bolum:'Genel Market', koridor:'', raf:'', yonTarifi:'Bu ürünün konumu için market görevlisine danışabilirsiniz.'};
}

// ── SKT: API'den tarih çek ────────────────────────────────
function sktApidenCek(product: any): string | null {
  // OpenFoodFacts alanları
  const tarih =
    product.expiration_date ||
    product['expiry_date'] ||
    product['best_before_date'] ||
    null;
  if (!tarih) return null;
  // Tarihi okunabilir hale getir
  return tarih.toString().trim();
}

// ── SKT: OCR metninden tarih bul ─────────────────────────
function sktOcrdenBul(metin: string): string | null {
  const patterns = [
    // GG.AA.YYYY veya GG/AA/YYYY
    /(?:SKT|S\.K\.T|SON\s*KUL|BEST\s*BEFORE|EXP|BBE)[:\s.]*(\d{2}[./]\d{2}[./]\d{2,4})/i,
    // Sadece tarih formatı GG.AA.YYYY
    /\b(\d{2}[./]\d{2}[./]\d{4})\b/,
    // AA/YYYY veya AA.YYYY
    /\b(\d{2}[./]\d{4})\b/,
    // YYYY-AA-GG (ISO)
    /\b(\d{4}-\d{2}-\d{2})\b/,
  ];
  for (const p of patterns) {
    const m = metin.match(p);
    if (m) return m[1] || m[0];
  }
  return null;
}

// ── SKT: tarihi Türkçe sesli metne çevir ─────────────────
function sktSesliMetin(skt: string): string {
  // GG.AA.YYYY → "12 Mart 2026"
  const aylar = ['', 'Ocak','Şubat','Mart','Nisan','Mayıs','Haziran',
                  'Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const bolumler = skt.replace(/\//g, '.').split('.');
  if (bolumler.length === 3) {
    const [b1, b2, b3] = bolumler;
    // GG.AA.YYYY
    if (b3.length === 4) {
      const ay = parseInt(b2, 10);
      return `${parseInt(b1, 10)} ${aylar[ay] || b2} ${b3}`;
    }
    // AA.YYYY (sadece ay/yıl)
    if (b1.length <= 2 && b2.length === 4) {
      const ay = parseInt(b1, 10);
      return `${aylar[ay] || b1} ${b2}`;
    }
  }
  if (bolumler.length === 2) {
    const ay = parseInt(bolumler[0], 10);
    return `${aylar[ay] || bolumler[0]} ${bolumler[1]}`;
  }
  return skt;
}

// ── SKT: tarihin geçerliliğini kontrol et ─────────────────
function sktDurumKontrol(skt: string): 'gecmis' | 'yakinda' | 'gecerli' {
  try {
    const bolumler = skt.replace(/\//g, '.').split('.');
    let tarih: Date;
    if (bolumler.length === 3 && bolumler[2].length === 4) {
      tarih = new Date(`${bolumler[2]}-${bolumler[1]}-${bolumler[0]}`);
    } else if (bolumler.length === 2) {
      tarih = new Date(`${bolumler[1]}-${bolumler[0]}-01`);
    } else {
      return 'gecerli';
    }
    const simdi  = new Date();
    const farkMs = tarih.getTime() - simdi.getTime();
    const farkGun = farkMs / (1000 * 60 * 60 * 24);
    if (farkGun < 0)  return 'gecmis';
    if (farkGun < 30) return 'yakinda';
    return 'gecerli';
  } catch {
    return 'gecerli';
  }
}

// ════════════════════════════════════════════════════════
// ── ÇOKLU API ZİNCİRİ ───────────────────────────────────
// ════════════════════════════════════════════════════════

async function openFoodFactsGetir(barkod: string): Promise<UrunBilgisi | null> {
  try {
    const res  = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barkod}.json`);
    const data = await res.json();
    if (data.status !== 1) return null;
    const p        = data.product;
    const ad       = p.product_name_tr || p.product_name || '';
    if (!ad) return null;
    const kategori = p.categories_tags?.[0]?.replace('en:', '') || '';
    return {
      ad, marka: p.brands || '', kategori,
      konum:  kategorideKonum(kategori, ad),
      kaynak: 'Gıda Veritabanı',
      skt:    sktApidenCek(p) || undefined,
    };
  } catch { return null; }
}

async function upcItemDbGetir(barkod: string): Promise<UrunBilgisi | null> {
  try {
    const res  = await fetch(
      `https://api.upcitemdb.com/prod/trial/lookup?upc=${barkod}`,
      {headers: {'Accept': 'application/json'}}
    );
    const data = await res.json();
    if (data.code !== 'OK' || !data.items?.length) return null;
    const item     = data.items[0];
    const ad       = item.title || '';
    if (!ad) return null;
    const kategori = item.category || '';
    return {
      ad, marka: item.brand || '', kategori,
      konum:  kategorideKonum(kategori, ad),
      kaynak: 'Genel Ürün Veritabanı',
    };
  } catch { return null; }
}

async function openBeautyFactsGetir(barkod: string): Promise<UrunBilgisi | null> {
  try {
    const res  = await fetch(`https://world.openbeautyfacts.org/api/v0/product/${barkod}.json`);
    const data = await res.json();
    if (data.status !== 1) return null;
    const p  = data.product;
    const ad = p.product_name || '';
    if (!ad) return null;
    const kategori = p.categories_tags?.[0]?.replace('en:', '') || 'kozmetik';
    return {
      ad, marka: p.brands || '', kategori,
      konum:  kategorideKonum(kategori, ad),
      kaynak: 'Kozmetik Veritabanı',
      skt:    sktApidenCek(p) || undefined,
    };
  } catch { return null; }
}

async function urunBilgisiGetir(barkod: string): Promise<UrunBilgisi | null> {
  const s1 = await openFoodFactsGetir(barkod);
  if (s1) return s1;
  const s2 = await upcItemDbGetir(barkod);
  if (s2) return s2;
  const s3 = await openBeautyFactsGetir(barkod);
  if (s3) return s3;
  return null;
}

// ── TTS ───────────────────────────────────────────────────
function sesliSoyele(metin: string) {
  Tts.stop();
  Tts.speak(metin);
}

// ── POS tutar bul ─────────────────────────────────────────
function tutarBul(metin: string): string | null {
  const patterns = [
    /₺\s*(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})/,
    /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*TL/i,
    /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*₺/,
    /TOPLAM[:\s]*(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})/i,
    /TUTAR[:\s]*(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})/i,
    /TOTAL[:\s]*(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})/i,
  ];
  for (const p of patterns) {
    const m = metin.match(p);
    if (m) return m[1];
  }
  return null;
}

function tutarSesliMetin(tutar: string): string {
  const noktasiz = tutar.replace(/\./g, '');
  const parcalar = noktasiz.split(',');
  if (parcalar.length === 2) return `${parcalar[0]} lira ${parcalar[1]} kuruş`;
  return `${noktasiz} Türk lirası`;
}

// ── Sesli komut işle ──────────────────────────────────────
function komutuIsle(
  metin: string,
  kameraAcFn: (mod: 'barkod' | 'pos') => void,
  sonBilgiOkuFn: () => void,
  iptalFn: () => void,
): boolean {
  const m = metin.toLowerCase().trim();
  if (m.match(/barkod|ürün|qr|tara|okut/)) {
    kameraAcFn('barkod');
    return true;
  }
  if (m.match(/pos|tutar|fiyat|ödeme|kasa/)) {
    kameraAcFn('pos');
    return true;
  }
  if (m.match(/tekrar|söyle|ne dedi|anlama|duyama/)) {
    sonBilgiOkuFn();
    return true;
  }
  if (m.match(/iptal|kapat|dur|geri/)) {
    iptalFn();
    return true;
  }
  if (m.match(/son kullanma|tarih|skt|ne zaman biter/)) {
    sesliSoyele('Son kullanma tarihi okumak için kamerayı ürünün üzerindeki tarihe tutun.');
    return true;
  }
  return false;
}

// ════════════════════════════════════════════════════════
// ── ANA BİLEŞEN ─────────────────────────────────────────
// ════════════════════════════════════════════════════════
export default function App() {
  const [mod,        setMod]        = useState<Mod>('ana');
  const [durum,      setDurum]      = useState('Hazır');
  const [urun,       setUrun]       = useState<UrunBilgisi | null>(null);
  const [tutar,      setTutar]      = useState<string | null>(null);
  const [sesAktif,   setSesAktif]   = useState(false); // mikrofon basılı mı
  const [izinDurumu, setIzinDurumu] = useState<'granted'|'denied'|'not-determined'>('not-determined');

  const tarandiRef  = useRef(false);
  const posRef      = useRef(false);
  const sktRef      = useRef(false);
  const cameraRef   = useRef<Camera>(null);
  const sonBilgiRef = useRef(''); // tekrar dinle için
  const device      = useCameraDevice('back');

  // ── İzinler & TTS & Voice başlat ──────────────────────
  useEffect(() => {
    Tts.setDefaultLanguage('tr-TR');
    Tts.setDefaultRate(0.5);

    Camera.requestCameraPermission().then(s => {
      setIzinDurumu(s === 'granted' ? 'granted' : 'denied');
    });

    // Voice olayları
    Voice.onSpeechResults = (e) => {
      const metin = e.value?.[0] || '';
      if (!metin) return;
      setDurum(`"${metin}" duyuldu`);
      const islendi = komutuIsle(
        metin,
        kameraAc,
        () => sesliSoyele(sonBilgiRef.current || 'Henüz bilgi yok.'),
        () => { setMod('ana'); setDurum('Hazır'); sesliSoyele('İptal edildi.'); },
      );
      if (!islendi) {
        sesliSoyele('Anlamadım. Barkod oku, POS oku veya tekrar söyle diyebilirsiniz.');
      }
    };

    Voice.onSpeechError = () => {
      Vibration.vibrate(TITRESIM.hata);
      setDurum('Ses anlaşılamadı');
      setSesAktif(false);
    };

    Voice.onSpeechEnd = () => setSesAktif(false);

    sesliSoyele('Alışveriş asistanı hazır. Mikrofon butonuna basılı tutarak komut verebilirsiniz.');

    return () => { Voice.destroy().then(Voice.removeAllListeners); };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // ── Mikrofon: bas & bırak ─────────────────────────────
  async function mikrofonBasildi() {
    try {
      Vibration.vibrate(TITRESIM.sesKomut);
      setSesAktif(true);
      setDurum('Dinliyorum...');
      await Voice.start('tr-TR');
    } catch {
      setSesAktif(false);
      setDurum('Mikrofon açılamadı');
    }
  }

  async function mikrofonBirakildi() {
    try {
      await Voice.stop();
    } catch {}
    setSesAktif(false);
  }

  // ── Kamera aç ─────────────────────────────────────────
  function kameraAc(hedefMod: 'barkod' | 'pos' | 'skt') {
    if (izinDurumu === 'denied') {
      Vibration.vibrate(TITRESIM.hata);
      Alert.alert('Kamera İzni Gerekli',
        'Lütfen uygulama ayarlarından kamera iznini etkinleştirin.',
        [{text: 'Tamam'}]);
      sesliSoyele('Kamera izni gerekli.');
      return;
    }
    if (!device) {
      Vibration.vibrate(TITRESIM.hata);
      sesliSoyele('Kamera bulunamadı.');
      return;
    }
    setUrun(null); setTutar(null);
    if (hedefMod === 'barkod') {
      setDurum('Kamera açık');
      sesliSoyele('Barkodu veya QR kodu kameraya tutun.');
    } else if (hedefMod === 'pos') {
      setDurum('POS kamera açık');
      sesliSoyele('POS cihazının ekranını kameraya tutun.');
    } else {
      setDurum('SKT kamera açık');
      sesliSoyele('Ürünün üzerindeki son kullanma tarihini kameraya tutun, sonra butona basın.');
    }
    setMod(hedefMod);
  }

  // ── Barkod / QR tarayıcı ──────────────────────────────
  const codeScanner = useCodeScanner({
    codeTypes: ['ean-13', 'ean-8', 'qr', 'code-128', 'upc-a', 'upc-e'],
    onCodeScanned: async (codes) => {
      if (tarandiRef.current) return;
      const deger = codes[0]?.value;
      if (!deger) return;
      tarandiRef.current = true;
      setMod('ana');
      Vibration.vibrate(TITRESIM.barkodOkundu);

      if (QR_KONUMLAR[deger]) {
        const konum = QR_KONUMLAR[deger];
        setDurum(`Konum: ${konum.bolum}`);
        setUrun({ad: konum.bolum, marka: 'Market Konumu', konum});
        setTimeout(() => Vibration.vibrate(TITRESIM.urunBulundu), 300);
        sonBilgiRef.current = konum.yonTarifi;
        sesliSoyele(konum.yonTarifi);
        setTimeout(() => { tarandiRef.current = false; }, 2000);
        return;
      }

      setDurum('Ürün aranıyor...');
      sesliSoyele('Barkod okundu, ürün aranıyor.');
      const bilgi = await urunBilgisiGetir(deger);
      if (bilgi) {
        setUrun(bilgi);
        setDurum(`Ürün bulundu — ${bilgi.kaynak}`);
        Vibration.vibrate(TITRESIM.urunBulundu);

        // SKT varsa sesli söyle
        let sktMetin = '';
        if (bilgi.skt) {
          const durum2 = sktDurumKontrol(bilgi.skt);
          const tarihOkunur = sktSesliMetin(bilgi.skt);
          if (durum2 === 'gecmis') {
            sktMetin = ` Dikkat! Son kullanma tarihi geçmiş: ${tarihOkunur}.`;
          } else if (durum2 === 'yakinda') {
            sktMetin = ` Dikkat! Son kullanma tarihi yaklaşıyor: ${tarihOkunur}.`;
          } else {
            sktMetin = ` Son kullanma tarihi: ${tarihOkunur}.`;
          }
        }

        const tamMetin = `${bilgi.marka ? bilgi.marka + ', ' : ''}${bilgi.ad}. ${bilgi.konum?.yonTarifi || ''}${sktMetin}`;
        sonBilgiRef.current = tamMetin;
        sesliSoyele(tamMetin);
      } else {
        setDurum('Ürün bulunamadı');
        Vibration.vibrate(TITRESIM.urunBulunamadi);
        const mesaj = 'Bu ürün hiçbir veritabanında bulunamadı. Son kullanma tarihini okumak ister misiniz?';
        sonBilgiRef.current = mesaj;
        sesliSoyele(mesaj);
      }
      setTimeout(() => { tarandiRef.current = false; }, 2000);
    },
  });

  // ── POS fotoğraf + OCR ────────────────────────────────
  async function posFotoCek() {
    if (posRef.current) return;
    posRef.current = true;
    setDurum('Ekran okunuyor...');
    sesliSoyele('Fotoğraf çekiliyor.');
    try {
      const foto = await cameraRef.current?.takePhoto({flash: 'off'});
      if (!foto) throw new Error();
      const sonuc        = await TextRecognition.recognize(`file://${foto.path}`);
      const bulunanTutar = tutarBul(sonuc.text);
      if (bulunanTutar) {
        setTutar(bulunanTutar);
        setUrun(null);
        setMod('ana');
        setDurum(`Tutar: ${bulunanTutar} TL`);
        Vibration.vibrate(TITRESIM.posBulundu);
        const mesaj = `Tutar: ${tutarSesliMetin(bulunanTutar)}`;
        sonBilgiRef.current = mesaj;
        sesliSoyele(mesaj);
      } else {
        setDurum('Tutar bulunamadı — tekrar deneyin');
        Vibration.vibrate(TITRESIM.hata);
        sesliSoyele('Tutar okunamadı. POS ekranını daha yakın tutun.');
        posRef.current = false;
      }
    } catch {
      setDurum('Hata oluştu');
      Vibration.vibrate(TITRESIM.hata);
      sesliSoyele('Bir hata oluştu.');
      posRef.current = false;
    }
    setTimeout(() => { posRef.current = false; }, 3000);
  }

  // ── SKT fotoğraf + OCR ────────────────────────────────
  async function sktFotoCek() {
    if (sktRef.current) return;
    sktRef.current = true;
    setDurum('Tarih okunuyor...');
    sesliSoyele('Fotoğraf çekiliyor.');
    try {
      const foto = await cameraRef.current?.takePhoto({flash: 'auto'});
      if (!foto) throw new Error();
      const sonuc     = await TextRecognition.recognize(`file://${foto.path}`);
      const bulunanSkt = sktOcrdenBul(sonuc.text);
      if (bulunanSkt) {
        setMod('ana');
        const tarihOkunur = sktSesliMetin(bulunanSkt);
        const durumKod    = sktDurumKontrol(bulunanSkt);

        // Mevcut ürüne SKT bilgisini ekle
        setUrun(prev => prev ? {...prev, skt: bulunanSkt} : {
          ad: 'SKT Okuma', marka: '', skt: bulunanSkt,
        });

        Vibration.vibrate(TITRESIM.urunBulundu);

        let mesaj = '';
        if (durumKod === 'gecmis') {
          mesaj = `Dikkat! Son kullanma tarihi geçmiş: ${tarihOkunur}. Bu ürünü tüketmeyin!`;
          setDurum(`⚠️ SKT GEÇMİŞ: ${bulunanSkt}`);
        } else if (durumKod === 'yakinda') {
          mesaj = `Dikkat! Son kullanma tarihi yaklaşıyor: ${tarihOkunur}.`;
          setDurum(`⚠️ SKT YAKLAŞIYOR: ${bulunanSkt}`);
        } else {
          mesaj = `Son kullanma tarihi: ${tarihOkunur}.`;
          setDurum(`✓ SKT: ${bulunanSkt}`);
        }
        sonBilgiRef.current = mesaj;
        sesliSoyele(mesaj);
      } else {
        setDurum('Tarih okunamadı — tekrar deneyin');
        Vibration.vibrate(TITRESIM.hata);
        sesliSoyele('Son kullanma tarihi okunamadı. Tarihin üzerine daha yakın tutun.');
        sktRef.current = false;
      }
    } catch {
      setDurum('Hata oluştu');
      Vibration.vibrate(TITRESIM.hata);
      sesliSoyele('Bir hata oluştu.');
      sktRef.current = false;
    }
    setTimeout(() => { sktRef.current = false; }, 3000);
  }

  // ── Kamera ekranı ─────────────────────────────────────
  if ((mod === 'barkod' || mod === 'pos' || mod === 'skt') && device) {
    const isPosOrSkt = mod === 'pos' || mod === 'skt';
    return (
      <View style={stil.kapsayici}>
        <Camera
          ref={cameraRef}
          style={stil.kamera}
          device={device}
          isActive={true}
          photo={isPosOrSkt}
          codeScanner={mod === 'barkod' ? codeScanner : undefined}
        />
        <View style={[
          stil.cerceve,
          mod === 'pos'  && stil.cercevePos,
          mod === 'skt'  && stil.cerceveSkt,
        ]}/>
        <Text style={stil.kameraYazi}>
          {mod === 'barkod' ? 'Barkodu çerçeveye alın'
           : mod === 'pos'  ? 'POS ekranını çerçeveye alın'
           :                  'Son kullanma tarihini çerçeveye alın'}
        </Text>
        {mod === 'pos' && (
          <TouchableOpacity style={stil.cekButon} onPress={posFotoCek}
            accessible={true} accessibilityRole="button"
            accessibilityLabel="Tutarı oku">
            <Text style={stil.cekYazi}>TUTARI OKU</Text>
          </TouchableOpacity>
        )}
        {mod === 'skt' && (
          <TouchableOpacity style={[stil.cekButon, stil.cekButonSkt]} onPress={sktFotoCek}
            accessible={true} accessibilityRole="button"
            accessibilityLabel="Son kullanma tarihini oku">
            <Text style={stil.cekYazi}>TARİHİ OKU</Text>
          </TouchableOpacity>
        )}
        <TouchableOpacity style={stil.iptalButon}
          onPress={() => { setMod('ana'); setDurum('Hazır'); }}
          accessible={true} accessibilityRole="button"
          accessibilityLabel="Kamerayı kapat">
          <Text style={stil.iptalYazi}>İPTAL</Text>
        </TouchableOpacity>
      </View>
    );
  }

  // ── Ana ekran ─────────────────────────────────────────
  return (
    <KeyboardAvoidingView style={{flex:1}}
      behavior={Platform.OS === 'ios' ? 'padding' : 'height'}>
      <ScrollView contentContainerStyle={stil.ekran}>

        {izinDurumu === 'denied' && (
          <View style={stil.uyariBand}>
            <Text style={stil.uyariYazi}>
              ⚠️ Kamera izni verilmedi. Ayarlar → Uygulama İzinleri bölümünden etkinleştirin.
            </Text>
          </View>
        )}

        {/* Durum bandı */}
        <View style={stil.durumBandi} accessible={true}
          accessibilityLabel={`Durum: ${durum}`}>
          <Text style={stil.durumYazi}>{durum}</Text>
        </View>

        {/* MİKROFON BUTONU */}
        <TouchableOpacity
          style={[stil.mikrofonButon, sesAktif && stil.mikrofonAktif]}
          onPressIn={mikrofonBasildi}
          onPressOut={mikrofonBirakildi}
          accessible={true}
          accessibilityRole="button"
          accessibilityLabel="Sesli komut. Basılı tutun ve konuşun."
          accessibilityHint="Barkod oku, POS oku, tekrar söyle veya iptal diyebilirsiniz.">
          <Text style={stil.mikrofonIkon}>{sesAktif ? '🎙️' : '🎤'}</Text>
          <Text style={stil.mikrofonYazi}>
            {sesAktif ? 'DİNLİYORUM...' : 'BASILI TUT — KONUŞ'}
          </Text>
        </TouchableOpacity>

        {/* Komut rehberi */}
        <View style={stil.komutKutu} accessible={true}
          accessibilityLabel="Sesli komutlar: barkod oku, pos oku, tekrar söyle, iptal">
          <Text style={stil.komutBaslik}>🗣️ Sesli Komutlar</Text>
          <Text style={stil.komutSatir}>"Barkod oku" → Kamera açılır</Text>
          <Text style={stil.komutSatir}>"POS oku" → Tutar okur</Text>
          <Text style={stil.komutSatir}>"Tekrar söyle" → Son bilgiyi okur</Text>
          <Text style={stil.komutSatir}>"İptal" → Kamerayı kapatır</Text>
        </View>

        {/* Ana butonlar */}
        <TouchableOpacity style={stil.buton}
          onPress={() => kameraAc('barkod')}
          accessible={true} accessibilityRole="button"
          accessibilityLabel="Barkod veya QR kod oku">
          <Text style={stil.butonYazi}>📷  BARKOD / QR OKU</Text>
        </TouchableOpacity>

        <TouchableOpacity style={[stil.buton, stil.butonPos]}
          onPress={() => kameraAc('pos')}
          accessible={true} accessibilityRole="button"
          accessibilityLabel="POS tutarını oku">
          <Text style={stil.butonYazi}>💳  POS TUTARI OKU</Text>
        </TouchableOpacity>

        <TouchableOpacity style={[stil.buton, stil.butonSkt]}
          onPress={() => kameraAc('skt')}
          accessible={true} accessibilityRole="button"
          accessibilityLabel="Son kullanma tarihini oku">
          <Text style={stil.butonYazi}>📅  SON KULLANMA TARİHİ</Text>
        </TouchableOpacity>

        {/* Ürün kartı */}
        {urun && (
          <View style={stil.kart} accessible={true}
            accessibilityLabel={`${urun.marka} ${urun.ad}`}>
            {urun.kaynak && <Text style={stil.kaynakEtiketi}>📦 {urun.kaynak}</Text>}
            <Text style={stil.kartMarka}>{urun.marka}</Text>
            <Text style={stil.kartAd}>{urun.ad}</Text>
            {urun.kategori ? <Text style={stil.kartDetay}>{urun.kategori}</Text> : null}

            {/* SKT kartı */}
            {urun.skt && (() => {
              const d = sktDurumKontrol(urun.skt!);
              return (
                <View style={[
                  stil.sktKutu,
                  d === 'gecmis'  && stil.sktKutuKirmizi,
                  d === 'yakinda' && stil.sktKutuSari,
                ]}>
                  <Text style={stil.sktBaslik}>Son Kullanma Tarihi</Text>
                  <Text style={[
                    stil.sktTarih,
                    d === 'gecmis'  && {color:'#ff4444'},
                    d === 'yakinda' && {color:'#ffaa00'},
                  ]}>
                    {d === 'gecmis'  ? '⚠️ GEÇMİŞ — ' : d === 'yakinda' ? '⚠️ YAKLAŞIYOR — ' : '✓ '}
                    {sktSesliMetin(urun.skt!)}
                  </Text>
                </View>
              );
            })()}

            {urun.konum && (
              <View style={stil.konumKutu}>
                <Text style={stil.konumBaslik}>Konum</Text>
                <Text style={stil.konumBolum}>{urun.konum.bolum}</Text>
                {urun.konum.koridor ? (
                  <Text style={stil.konumDetay}>
                    Koridor: {urun.konum.koridor}
                    {urun.konum.raf ? `   Raf: ${urun.konum.raf}` : ''}
                  </Text>
                ) : null}
                <Text style={stil.konumTarif}>{urun.konum.yonTarifi}</Text>
                <TouchableOpacity style={stil.tekrarButon}
                  onPress={() => sesliSoyele(urun.konum!.yonTarifi)}
                  accessible={true} accessibilityRole="button"
                  accessibilityLabel="Konumu tekrar dinle">
                  <Text style={stil.tekrarYazi}>Konumu Dinle</Text>
                </TouchableOpacity>
              </View>
            )}

            <TouchableOpacity
              style={[stil.tekrarButon, {marginTop: 8}]}
              onPress={() => sesliSoyele(sonBilgiRef.current)}
              accessible={true} accessibilityRole="button"
              accessibilityLabel="Ürün bilgisini tekrar dinle">
              <Text style={stil.tekrarYazi}>Tekrar Dinle</Text>
            </TouchableOpacity>
          </View>
        )}

        {/* Tutar kartı */}
        {tutar && (
          <View style={[stil.kart, stil.kartPos]} accessible={true}
            accessibilityLabel={`Tutar: ${tutarSesliMetin(tutar)}`}>
            <Text style={stil.kartMarka}>POS Tutarı</Text>
            <Text style={stil.kartTutar}>{tutar} TL</Text>
            <TouchableOpacity style={stil.tekrarButon}
              onPress={() => sesliSoyele(`Tutar ${tutarSesliMetin(tutar)}`)}
              accessible={true} accessibilityRole="button"
              accessibilityLabel="Tutarı tekrar dinle">
              <Text style={stil.tekrarYazi}>Tekrar Dinle</Text>
            </TouchableOpacity>
          </View>
        )}

      </ScrollView>
    </KeyboardAvoidingView>
  );
}

// ── Stiller ───────────────────────────────────────────────
