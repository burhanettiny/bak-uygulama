# Gradle ve React Native derleme ayarları.
# Yayın imzası (BAK_YAYIN_*) burada değil, kullanıcının ~/.gradle/gradle.properties dosyasındadır; depoya konmaz.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# Derlenecek işlemci mimarileri (tek mimari için: -PreactNativeArchitectures=arm64-v8a)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true
hermesEnabled=true
