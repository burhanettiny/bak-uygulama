  cekYazi:       {color:'#fff', fontSize:20, fontWeight:'bold'},
  iptalButon:    {position:'absolute', bottom:40, alignSelf:'center',
                  backgroundColor:'#333', paddingHorizontal:32,
                  paddingVertical:14, borderRadius:12},
