  // SKT
  sktKutu:       {backgroundColor:'#0d2200', borderRadius:8, padding:12,
                  marginBottom:12, borderWidth:1, borderColor:'#1a4400'},
  sktKutuKirmizi:{backgroundColor:'#2a0000', borderColor:'#660000'},
  sktKutuSari:   {backgroundColor:'#2a1a00', borderColor:'#664400'},
